<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Oups ! Page introuvable – MagJury</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <style>
    :root {
      --primary: #2c5530;
      --primary-light: #d8edd8;
      --danger: #e74c3c;
      --gray: #6c757d;
      --gray-light: #f8f9fa;
      --white: #ffffff;
      --transition: .3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--white) 100%);
      color: var(--primary);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .error-card {
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
      max-width: 420px;
      width: 100%;
      padding: 48px 32px;
      transition: var(--transition);
    }

    .error-icon {
      font-size: 64px;
      color: var(--danger);
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      font-size: 16px;
      color: var(--gray);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-home {
      display: inline-block;
      background: var(--primary);
      color: var(--white);
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }

    .btn-home:hover {
      background: #244026;
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 20px;
      }
      p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="error-card">
    <div class="error-icon">😵</div>
    <h1>Page introuvable</h1>
    <p>Il semble que cette page ait été déplacée ou n’existe pas.</p>
    <a href="/" class="btn-home">Retour à l’accueil</a>
  </div>
</body>
</html>
