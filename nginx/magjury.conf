# ==============================================
# CONFIGURATION NGINX POUR MAGJURY
# Reverse Proxy + SSL Let's Encrypt + Optimisations
# ==============================================

# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name magjury.org www.magjury.org test.magjury.org;

    # Endpoint pour la validation Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirection HTTPS (après obtention des certificats)
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Configuration HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name magjury.org www.magjury.org test.magjury.org;

    # Certificats SSL Let's Encrypt (à configurer après Certbot)
    ssl_certificate /etc/nginx/ssl/live/magjury.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/magjury.org/privkey.pem;

    # Protocoles et Ciphers sécurisés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Taille maximale des uploads (PDF juridiques 50MB)
    client_max_body_size 50M;

    # Timeouts pour les requêtes longues
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    # Logs
    access_log /var/log/nginx/magjury_access.log;
    error_log /var/log/nginx/magjury_error.log;

    # Assets statiques (servis directement par Nginx)
    location ~ ^/(assets|packs)/ {
        proxy_pass http://app:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
        expires max;
    }

    # WebSockets pour Action Cable
    location /cable {
        proxy_pass http://app:3000/cable;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Toutes les autres requêtes vers Rails
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;

        # Gestion des erreurs
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # Page d'erreur personnalisée
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
