version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: magjury_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-magjury_production}
      POSTGRES_USER: ${POSTGRES_USER:-magjury}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups  # Pour les dumps de sauvegarde
    networks:
      - magjury_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magjury}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis (Action Cable)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: magjury_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - magjury_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================
  # Rails Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: magjury_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-magjury}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-magjury_production}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-magjury_production}
      POSTGRES_USER: ${POSTGRES_USER:-magjury}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      WEB_CONCURRENCY: 2
      RAILS_MAX_THREADS: 5
      RAILS_MIN_THREADS: 5
    volumes:
      - ./log:/app/log
      - ./storage:/app/storage
    networks:
      - magjury_network
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:1.25-alpine
    container_name: magjury_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/magjury.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # Certificats Let's Encrypt
      - ./log/nginx:/var/log/nginx
    networks:
      - magjury_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================
# Volumes persistants
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================
# Réseau interne
# ============================================
networks:
  magjury_network:
    driver: bridge
